<mat-card class="page-card">
  <mat-card-header>
    <mat-card-title>用户管理</mat-card-title>
    <mat-card-subtitle><a routerLink="/admin">← 返回管理区</a></mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <button mat-flat-button color="primary" (click)="openCreate()">新建用户</button>
    @if (loading()) {
      <p>加载中…</p>
    } @else if (error()) {
      <p class="form-error">{{ error() }}</p>
    } @else {
      <table mat-table [dataSource]="rows()" class="full-width">
        <ng-container matColumnDef="username">
          <th mat-header-cell *matHeaderCellDef>用户名</th>
          <td mat-cell *matCellDef="let u">{{ u.username }}</td>
        </ng-container>
        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>邮箱</th>
          <td mat-cell *matCellDef="let u">{{ u.email }}</td>
        </ng-container>
        <ng-container matColumnDef="displayName">
          <th mat-header-cell *matHeaderCellDef>显示名</th>
          <td mat-cell *matCellDef="let u">{{ u.displayName || '—' }}</td>
        </ng-container>
        <ng-container matColumnDef="role">
          <th mat-header-cell *matHeaderCellDef>角色</th>
          <td mat-cell *matCellDef="let u">{{ u.role }}</td>
        </ng-container>
        <ng-container matColumnDef="createdAt">
          <th mat-header-cell *matHeaderCellDef>创建</th>
          <td mat-cell *matCellDef="let u">{{ u.createdAt | date: 'yyyy-MM-dd' }}</td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>操作</th>
          <td mat-cell *matCellDef="let u">
            <button mat-button (click)="openEdit(u)">编辑</button>
            @if (pendingDeleteId() === u.id) {
              <button mat-button color="warn" (click)="deleteUser(u.id)">确认删除？</button>
              <button mat-button (click)="cancelDelete()">取消</button>
            } @else {
              <button mat-button color="warn" (click)="confirmDelete(u.id)">删除</button>
            }
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr mat-row *matRowDef="let row; columns: columns"></tr>
      </table>
    }
  </mat-card-content>
</mat-card>
