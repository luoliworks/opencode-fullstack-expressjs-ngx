<h2 mat-dialog-title>{{ isEdit ? '编辑文章' : '新建文章' }}</h2>
<mat-dialog-content class="dialog-content">
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>标题</mat-label>
    <input matInput [(ngModel)]="title" name="title" required autocomplete="off" />
  </mat-form-field>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>slug（链接唯一标识）</mat-label>
    <input matInput [(ngModel)]="slug" name="slug" required autocomplete="off" />
  </mat-form-field>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>正文</mat-label>
    <textarea matInput [(ngModel)]="content" name="content" rows="6"></textarea>
  </mat-form-field>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>状态</mat-label>
    <mat-select [(ngModel)]="status" name="status">
      <mat-option value="draft">draft（草稿）</mat-option>
      <mat-option value="published">published（已发布）</mat-option>
    </mat-select>
  </mat-form-field>
  @if (error()) {
    <p class="form-error">{{ error() }}</p>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close [disabled]="busy()">取消</button>
  <button mat-flat-button color="primary" (click)="save()" [disabled]="busy()">
    {{ busy() ? '请稍候…' : '保存' }}
  </button>
</mat-dialog-actions>
