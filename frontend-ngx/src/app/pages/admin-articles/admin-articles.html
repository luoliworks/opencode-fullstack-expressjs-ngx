<mat-card class="page-card">
  <mat-card-header>
    <mat-card-title>文章管理</mat-card-title>
    <mat-card-subtitle><a routerLink="/admin">← 返回管理区</a></mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <button mat-flat-button color="primary" (click)="openCreate()">新建文章</button>
    @if (loading()) {
      <p>加载中…</p>
    } @else if (error()) {
      <p class="form-error">{{ error() }}</p>
    } @else {
      <table mat-table [dataSource]="rows()" class="full-width">
        <ng-container matColumnDef="title">
          <th mat-header-cell *matHeaderCellDef>标题</th>
          <td mat-cell *matCellDef="let a">{{ a.title }}</td>
        </ng-container>
        <ng-container matColumnDef="slug">
          <th mat-header-cell *matHeaderCellDef>slug</th>
          <td mat-cell *matCellDef="let a">{{ a.slug }}</td>
        </ng-container>
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>状态</th>
          <td mat-cell *matCellDef="let a">{{ a.status }}</td>
        </ng-container>
        <ng-container matColumnDef="updatedAt">
          <th mat-header-cell *matHeaderCellDef>更新</th>
          <td mat-cell *matCellDef="let a">{{ a.updatedAt | date: 'yyyy-MM-dd HH:mm' }}</td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>操作</th>
          <td mat-cell *matCellDef="let a">
            <button mat-button (click)="openEdit(a)">编辑</button>
            @if (pendingDeleteId() === a.id) {
              <button mat-button color="warn" (click)="deleteArticle(a.id)">确认删除？</button>
              <button mat-button (click)="cancelDelete()">取消</button>
            } @else {
              <button mat-button color="warn" (click)="confirmDelete(a.id)">删除</button>
            }
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr mat-row *matRowDef="let row; columns: columns"></tr>
      </table>
      <mat-paginator
        [length]="total()"
        [pageIndex]="page() - 1"
        [pageSize]="pageSize()"
        [pageSizeOptions]="[25, 50, 100]"
        (page)="onPage($event)"
      />
    }
  </mat-card-content>
</mat-card>
