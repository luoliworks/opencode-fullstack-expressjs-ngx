<mat-card class="page-card">
  <mat-card-header>
    <mat-card-title>Simple CMS</mat-card-title>
    <mat-card-subtitle>公开文章列表（无需登录）</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    @if (loading()) {
      <p>加载中…</p>
    } @else if (loadError()) {
      <p>{{ loadError() }}</p>
    } @else if (articles().length === 0) {
      <p>还没有已发布的文章。</p>
    } @else {
      <mat-list>
        @for (a of articles(); track a.id) {
          <mat-list-item>
            <span matListItemTitle>{{ a.title }}</span>
            <span matListItemLine>{{ a.content.slice(0, 120) }}</span>
          </mat-list-item>
        }
      </mat-list>
    }
  </mat-card-content>
  <mat-card-actions>
    <a mat-button routerLink="/login">登录 / 管理</a>
  </mat-card-actions>
</mat-card>
