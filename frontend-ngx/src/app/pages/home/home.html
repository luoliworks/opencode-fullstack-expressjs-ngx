<mat-card class="page-card">
  <mat-card-header>
    <mat-card-title>Simple CMS</mat-card-title>
    <mat-card-subtitle>欢迎回来，{{ auth.currentUser()?.username }}（{{ auth.currentUser()?.role }}）</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <mat-nav-list>
      <a mat-list-item href="/api">/api — 接口索引</a>
      <a mat-list-item href="/api/articles">/api/articles — 文章</a>
      <a mat-list-item href="/api/users">/api/users — 用户</a>
      <a mat-list-item href="/health">/health — 健康检查</a>
    </mat-nav-list>
  </mat-card-content>
  <mat-card-actions>
    <button mat-button (click)="auth.logout()">退出登录</button>
  </mat-card-actions>
</mat-card>
