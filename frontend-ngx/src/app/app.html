<mat-toolbar color="primary">
  <a class="brand" routerLink="/">Simple CMS</a>
  <span class="spacer"></span>
  @if (auth.isLoggedIn()) {
    <span class="user">{{ auth.currentUser()?.username }}</span>
    <button mat-button (click)="auth.logout()">退出</button>
  } @else {
    <a mat-button routerLink="/login">登录</a>
  }
</mat-toolbar>
<main>
  <router-outlet />
</main>
