<mat-toolbar color="primary">
  <a class="brand" routerLink="/">Simple CMS</a>
  <span class="spacer"></span>
  @if (auth.isLoggedIn()) {
    <a mat-button routerLink="/admin">管理</a>
    <a mat-button routerLink="/admin/articles">文章</a>
    @if (auth.currentUser()?.role === 'admin') {
      <a mat-button routerLink="/admin/users">用户</a>
    }
    <span class="user">{{ auth.currentUser()?.username }}</span>
    <button mat-button (click)="auth.logout()">退出</button>
  } @else {
    <a mat-button routerLink="/login">登录</a>
  }
</mat-toolbar>
<main>
  <router-outlet />
</main>
