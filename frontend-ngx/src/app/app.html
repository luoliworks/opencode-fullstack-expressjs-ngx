<header class="topbar">
  <a class="brand" routerLink="/">Simple CMS</a>
  <nav>
    @if (auth.isLoggedIn()) {
      <span class="user">{{ auth.currentUser()?.username }}</span>
      <button type="button" (click)="auth.logout()">退出</button>
    } @else {
      <a routerLink="/login">登录</a>
    }
  </nav>
</header>
<main>
  <router-outlet />
</main>
